name: Validate

on:
  pull_request:
  push:
    branches: [master]
  release:
    types: [published]

jobs:
  test:
    name: Test HA ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.7.0"
            requirements: requirements-test-min.txt
          - homeassistant: "2026.9.1"
            requirements: requirements-test.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test*.txt
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: python -m pytest -q

  validate-python:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile integration
        run: python -m compileall -q custom_components
      - name: Lint
        run: |
          python -m pip install ruff==0.16.6
          ruff check --isolated --select E4,E7,E9,F,I,B custom_components tests
          ruff format --isolated --check custom_components tests
      - name: Validate JSON
        run: |
          python -m json.tool custom_components/oswald_conversation/manifest.json >/dev/null
          python -m json.tool custom_components/oswald_conversation/strings.json >/dev/null
          python -m json.tool custom_components/oswald_conversation/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          comment: false
